name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Git tags are the single source of truth for the version, the release workflow
      # stamps it in with tools/set-version.sh. A committed version means someone ran it
      # locally and committed the result.
      - name: Version placeholder is unchanged
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          locked=$(awk 'found && /^version = / { gsub(/"/, "", $3); print $3; exit } { found = ($0 == "name = \"hivemind\"") }' src-tauri/Cargo.lock)
          if [[ "$version" != "0.0.0" || "$locked" != "0.0.0" ]]; then
            echo "::error::src-tauri/Cargo.toml ($version) and Cargo.lock ($locked) must stay at 0.0.0. The version comes from the git tag, see docs/RELEASING.md."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Bindings are up to date
        run: git diff --exit-code src/lib/bindings.ts

      - name: Build app (no installer)
        run: npx tauri build --no-bundle
